spring.application.name=tienda-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:clave-de-desarrollo-no-usar-en-produccion-123456}
jwt.expiration=86400000

app.cors.origin=${CORS_ORIGIN:http://localhost:4200}
server.error.include-message=always